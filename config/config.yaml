# amyloevo workflow configuration.
#
# Every path is relative to the workflow's working directory unless absolute, so
# this file moves between a laptop and a server unchanged. Nothing here is
# machine-specific except `resources` and the tool paths under `tools`.

# --- Input ------------------------------------------------------------------
# One multifasta of orthologues per protein of interest (an EggNOG group).
# Filenames give the protein ids: <orthologs_dir>/<protein>.fasta
orthologs_dir: "data/orthologs"
orthologs_suffix: ".fasta"

# The reference sequence, by id, inside each group. When absent from a group the
# workflow fails for that protein rather than quietly measuring conservation with
# no anchor -- the reference is what APR coordinates are reported against.
reference:
  # How to recognise it in a header. "taxid" matches the EggNOG taxid prefix.
  match: taxid
  value: "9606"          # Homo sapiens
  required: true

# Header format: eggnog | uniprot | ncbi. Strict parsing by default -- an
# orthologue with no taxon cannot be placed on the species tree, and a set with
# several such orthologues yields a phylogenetic test on a subset nobody chose.
header_format: eggnog
header_strict: true

# --- Redundancy: correct it ONCE -------------------------------------------
# Clustering and phylogenetic weighting address the same problem -- densely
# sampled clades counting many times in a per-column fraction. Applying both
# double-corrects and leaves a denominator nobody can reconstruct.
#   method: cluster    -> CD-HIT/MMseqs2 reduces the set; weighting is disabled
#   method: weight     -> every sequence is kept; conservation is tree-weighted
#   method: none       -> neither (report only; expect clade bias)
# `cap_only` clustering is a compute bound, not a sampling correction, and is
# recorded separately so the two are never confused in the provenance.
redundancy:
  method: weight
  cluster:
    tool: mmseqs2           # mmseqs2 | cdhit
    identity: 0.95
    coverage: 0.8
    cap_only: false

# --- Alignment --------------------------------------------------------------
# The aligner and its parameters are recorded with every result: alignment choice
# moves column assignments, so two runs with different aligners are not
# comparable, and the residual is a difference of two alignment-dependent terms.
align:
  tool: mafft               # mafft | muscle
  mafft_args: "--auto --anysymbol --quiet"
  muscle_args: ""
  famsa_args: "-gt upgma"

# --- Predictor panel --------------------------------------------------------
# The LOCAL panel. Five of aggressor-wrappers' twelve predictors are web-only
# (aggrescan, foldamyloid, waltz, pasta, aggreprot) and cannot serve 10^4-10^5
# sequences. The reference sequence is scored by this same panel, as one member
# of its own alignment -- never compared against a twelve-tool call.
predict:
  panel: [appnn, archcandy, crossbeta, foldamyloid, pasta2, aggreprot, tango, amyloid-predict, amylogram, amylodeep]
  aggressor_config: "config/aggressor.cfg"
  consensus: fractional_consensus
  apr_threshold: 0.5        # fraction of the panel calling a residue
  # Skip prediction entirely and read APR intervals from a file instead. Gives
  # sequence conservation and the occupancy bookkeeping, but not APR conservation
  # and therefore not the residual.
  from_intervals: null      # e.g. "data/known_aprs.tsv"

# --- Taxonomy and labelling -------------------------------------------------
# Resolving taxids is not cosmetic. A taxon that fails to resolve leaves the
# analysis silently: it is dropped from every rank-wise denominator without ever
# being counted as missing. `results/meta/<protein>.unresolved.txt` is the list,
# and it is an output rather than a log line for that reason.
taxonomy:
  # An UNPACKED NCBI taxdump directory (names.dmp, nodes.dmp, merged.dmp).
  #   curl -O https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz
  #   mkdir -p data/taxdump && tar -xzf taxdump.tar.gz -C data/taxdump
  # merged.dmp matters: an orthologue set assembled a few years ago carries
  # taxids NCBI has since merged, and without it those species resolve to
  # nothing.
  taxdump: null             # e.g. "data/taxdump"
  # Fallback when there is no taxdump: a TSV with a `taxid` column and whatever
  # rank columns it has. Cheaper, and only as complete as the file.
  table: null               # e.g. "data/taxonomy.tsv"
  # Ranks carried into the metadata table and tested by the signal screen.
  # Nested, so they are four dependent tests on one dataset and the p-values are
  # BH-adjusted across them.
  ranks: [phylum, class, order, family, genus, species]

# How a sequence is named on an axis. `9606.ENSP00000350170` is unique, stable
# and unreadable; `Homo sapiens FXR1` is readable and not guaranteed unique. So:
# label by meaning, fall back down a chain, disambiguate collisions with the
# accession on EVERY member of the colliding set, and keep `id` on the table for
# joins and provenance.
#
# Fields: {id} {protein} {taxid} {tax_name} {group} {protein_name} and every
# rank above. A figure of one species' paralogues wants "{group}" alone; one
# group's orthologues wants "{tax_name}".
label:
  template: "{tax_name} {group}"
  reference: "reference"    # axis label for the reference coordinate

# --- Paralogue groups: establish them BEFORE measuring conservation ---------
# An "orthologue set" from EggNOG or STRING is routinely a paralogue family, and
# the paralogue differences are usually the larger ones. The FXR1 set that
# prompted this section is 372 sequences described as FXR1 orthologues and is in
# fact the whole FMR1/FXR1/FXR2 family; FXR1 and FMR1 differ roughly twofold in
# APR load, which swamps anything within either group.
#
# Leave `references` null for a set that really is one orthologue group --
# inventing a split is worse than having none.
group:
  # sequence id -> group name. Typically one well-annotated species' paralogues,
  # and they must be members of the aligned set, not separate sequences.
  #   9606.ENSP00000350170: FXR1
  #   9606.ENSP00000359506: FMR1
  #   9606.ENSP00000250113: FXR2
  references: null
  # Below this best-vs-second identity margin an assignment is a rounding, not a
  # call, and the sequence is excluded from any BETWEEN-group contrast. On the
  # FXR1 set 20 of 314 assigned sequences (6.4%) fall below it.
  min_margin: 0.05
  # Sequences OUTSIDE the reference groups -- lineages predating the duplication
  # that produced them. A metadata column name holding a truthy flag, or an
  # explicit list of ids. This cannot be inferred from the margin: on the FXR1
  # set every one of the 58 invertebrate genes falls below 0.05 (a perfectly
  # sensitive screen) but so do 20 vertebrate sequences that genuinely belong to
  # a paralogue. A low margin means AMBIGUOUS, not PRE-DUPLICATION.
  outgroup: null            # e.g. "is_invertebrate", or [id1, id2, ...]
  outgroup_label: outgroup

# --- APR blocks: the features, which matter more than the test --------------
# A per-column profile over a long alignment is sparse -- in the FXR1 family each
# protein covers 40-90 of the 623 columns ever covered -- so clustering or
# testing it directly measures mostly shared absence. Columns are grouped into
# blocks and each sequence scored by the fraction of each block it covers.
#
# Blocks are defined per group and then merged: a block carried by a minority of
# one group is exactly the discriminative feature a group contrast needs, and the
# pooled definition misses it. min_occupancy is therefore LOWER than
# conserve.min_occupancy on purpose -- defining a feature and calling a column
# conserved are different decisions.
blocks:
  min_occupancy: 0.35
  min_coverage: 0.4
  min_width: 3
  # Dips of up to this many columns are bridged. One column below threshold
  # inside a solid run is one indel in one sequence, and splitting there leaves
  # two sub-width fragments that are both dropped -- so the block disappears
  # rather than merely shifting.
  max_gap: 2
  # A group smaller than this does not define blocks: with four sequences every
  # threshold lands on a count of one or two.
  min_group: 5

# --- Conservation -----------------------------------------------------------
conserve:
  # Columns below this occupancy are reported UNDEFINED, not conserved: with a
  # handful of sequences the entropy is near zero whatever the residues are, so
  # every insertion would otherwise enter as a maximally conserved site.
  min_occupancy: 0.5
  background: swissprot     # swissprot | uniform

# --- Phylogenetics ----------------------------------------------------------
# APR presence across species is not independent -- shared ancestry makes a naive
# clade correlation pseudoreplication.
phylo:
  tree: infer               # infer | species | none
  # --alrt as well as -B. UFBoot and SH-aLRT are not on the same scale and are
  # conventionally read together -- a clade is well supported at UFBoot >= 95 AND
  # SH-aLRT >= 80 -- because either alone accepts clades the other rejects. On a
  # paralogue family the contested nodes are exactly the short internal ones that
  # decide whether a paralogue group is monophyletic, so both are needed.
  iqtree_args: "-m MFP -B 1000 --alrt 1000 --quiet"
  # Binary-trait signal: fritz_purvis_d | pagel_lambda | both
  signal: both
  # Dependency of APR presence on divergence and clade
  regression: phyloglm
  species_tree: null        # a Newick file, when tree: species

  # --- The gene tree, and the traits put on it ------------------------------
  # `tree: infer` on a paralogue family gives a GENE tree: the duplication sits
  # inside it. D and lambda over the whole tree then answer "does the trait
  # follow the history of these genes, duplication included"; the per-paralogue
  # question needs that clade's subtree, and whether the clade exists at all is
  # a property of the tree rather than of the assignment. Both are reported.
  #
  # A tip whose aligned row is mostly gaps is placed by missing data: absent
  # characters do not constrain the topology, so the tip lands wherever the
  # remaining columns point and drags its neighbours' branch lengths with it.
  # Dropped BEFORE inference -- pruning it from a finished tree does not undo
  # that. On the FXR1 trimmed alignment 15 of 372 sequences fall below 0.5.
  #
  # Identical rows are NOT dropped. They give zero-length branches, which look
  # like something to clean up and are not: IQ-TREE collapses them for the
  # search and restores them in the output, whereas deduplicating picks one
  # member as the representative and discards the others' traits. On that same
  # alignment 11 of 33 identical-row groups hold members whose APR masks differ,
  # by up to 84 residues.
  min_tip_occupancy: 0.5
  # The outgroup must be MONOPHYLETIC on the tree before it can root it. When it
  # is not, its MRCA holds ingroup tips and rooting there moves them across the
  # root. That disagreement between the declaration and the tree is a finding,
  # not a detail to route around, so the default is to refuse.
  require_outgroup_monophyly: true
  # A block counts as PRESENT when a sequence covers more than this fraction of
  # it. There is no natural cut in a coverage fraction, and this one moves the
  # prevalence of every trait at once -- the quantity D is most sensitive to.
  # Re-run at 0.4 and 0.6: a conclusion that does not survive is a conclusion
  # about the threshold. On the FXR1 blocks 13 of 15 are testable at 0.5, 12 at
  # 0.4, 13 at 0.6.
  presence_threshold: 0.5
  # D and phyloglm need both states present in quantity. The count and the
  # fraction catch different designs: 10 of 12 tips passes the count and fails
  # the fraction, 10 of 5,000 the reverse. The two FXR1 blocks that fail are the
  # near-universal ones (98.6% and 95.7% prevalence) -- a block every sequence
  # carries has no variation for the tree to explain, which is a limit of the
  # question, not a fixable threshold.
  min_minority: 10
  min_prevalence: 0.05
  # One test per block, per p-value column, each column its own family. Note
  # that a permutation p cannot fall below 1/(permutations+1), and BH at this
  # alpha over m blocks cannot reject anything unless some p reaches alpha/m --
  # amyloevo.phylo.estimate.floor_warning checks it rather than trusting it.
  alpha: 0.05

  # --- The taxonomic signal screen ------------------------------------------
  # PERMANOVA per rank on the block profiles, run WITHIN each paralogue group:
  # every member of a three-paralogue family contributes one of each, so clade
  # and paralogue explain the same variance in a pooled test.
  #
  # This screen is NOT the phylogenetic test above and does not discharge it. A
  # rank effect means profiles CLUSTER by clade, which nested sampling alone
  # produces. It decides whether building the tree is worth the compute.
  permutations: 999
  seed: 0
  # A level needs this many members to be tested, and a rank this many surviving
  # levels and sequences. Without them pseudo-F and R^2 rise mechanically as
  # levels approach singletons: with 56 families among 77 sequences, within-group
  # scatter is zero by construction and R^2 goes to 1 whatever the data say.
  min_per_level: 3
  min_levels: 4
  min_members: 12

# --- Visualisation ----------------------------------------------------------
viz:
  logos: true
  group_figures: true    # occupancy, block heatmap, paired load
  meme_export: true         # APR segments in MEME format for motif discovery
  itol: true                # annotation files for iTOL

# --- Execution --------------------------------------------------------------
tools:
  mafft: mafft
  muscle: muscle
  famsa: famsa
  mmseqs: mmseqs
  cdhit: cd-hit
  iqtree: iqtree2
  rscript: Rscript
  aggressor: aggressor-wrappers

resources:
  align_threads: 4
  predict_threads: 4
  tree_threads: 4
